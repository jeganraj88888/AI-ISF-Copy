<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-ISF | Devices</title><link rel="stylesheet" href="xdr.css"></head><body><script src="xdr.js"></script><script>
shell('Devices','Devices','Endpoints observed from real authentication telemetry',`
<div class="grid g4"><div class="stat s-cyan"><div class="ico">${ic('monitor')}</div><div class="lab">Observed devices</div><div class="num" id="aTot">—</div><div class="sub">unique fingerprints</div></div><div class="stat s-green"><div class="ico">${ic('pulse')}</div><div class="lab">Active · 24h</div><div class="num" id="aAct">—</div><div class="sub">seen in the last day</div></div><div class="stat s-red"><div class="ico">${ic('x')}</div><div class="lab">Failed events</div><div class="num" id="aFail">—</div><div class="sub" id="aEv">&nbsp;</div></div><div class="stat s-violet"><div class="ico">${ic('settings')}</div><div class="lab">Operating systems</div><div class="num" id="aOs">—</div><div class="sub" id="aOsL">&nbsp;</div></div></div>
<div class="panel"><div class="ph"><div><h2>Observed Devices</h2><div class="sub" id="aCount"></div></div><a class="btn" href="/api/download/agents.csv">${ic('download')} CSV</a></div><div id="tAg"></div></div>`);
let T,ALL=[];const rate=x=>x.events?Math.round(x.successes/x.events*100):0;
function drawer(x){openDrawer(x.id,`<div style="margin-bottom:16px"><span class="pill ${x.status==='ACTIVE'?'g':'x'}">${esc(x.status)}</span></div><dl class="kv"><dt>Host</dt><dd>${esc(x.device)}</dd><dt>OS</dt><dd>${esc(x.os)}</dd><dt>Fingerprint</dt><dd class="mono">${esc(x.fingerprint)}</dd><dt>Events</dt><dd>${x.events}</dd><dt>Successful</dt><dd>${x.successes}</dd><dt>Failed</dt><dd>${x.failures}</dd><dt>Success rate</dt><dd>${rate(x)}%</dd><dt>Last seen</dt><dd>${fmt(x.last_seen)}</dd></dl><div style="margin-top:22px"><a class="btn primary" href="detections.html?q=${encodeURIComponent(x.os)}">View detections →</a></div>`,esc(x.device))}
async function load(){const d=await getJSON('/api/agents');ALL=d?.agents||[];const evs=ALL.reduce((n,x)=>n+x.events,0),oss=[...new Set(ALL.map(x=>x.os))];$('aTot').textContent=ALL.length;$('aAct').textContent=ALL.filter(x=>x.status==='ACTIVE').length;$('aFail').textContent=ALL.reduce((n,x)=>n+x.failures,0);$('aEv').textContent=`of ${evs} events`;$('aOs').textContent=oss.length;$('aOsL').textContent=oss.slice(0,3).join(' · ')||'—';$('aCount').textContent=`${ALL.length} observed endpoint${ALL.length===1?'':'s'}`;
 if(!T)T=DT({mount:'tAg',size:12,id:x=>x.id,sort:6,dir:-1,onRow:drawer,empty:'<div class="big">◌</div><strong>No devices observed yet</strong>Devices appear after the first recorded sign-in attempt.',
  cols:[{h:'AGENT',s:x=>x.id,r:x=>`<span class="mono" style="color:var(--cyan)">${esc(x.id)}</span>`,cls:'nw'},{h:'HOST',s:x=>x.device,r:x=>`<div class="t1">${esc(x.device)}</div>`},{h:'OS',s:x=>x.os,r:x=>`<span class="pill b">${esc(x.os)}</span>`},{h:'FINGERPRINT',r:x=>`<span class="mono muted" title="${esc(x.fingerprint)}">${esc(String(x.fingerprint).slice(0,14))}…</span>`},{h:'EVENTS',s:x=>x.events,r:x=>`<span class="mono">${x.events}</span>`},{h:'SUCCESS RATE',s:x=>rate(x),r:x=>`<span class="rbar" style="color:${rate(x)>=70?'#34d399':rate(x)>=40?'#fbbf24':'#fb7185'}">${rate(x)}%<u><i style="width:${rate(x)}%;background:currentColor"></i></u></span>`},{h:'LAST SEEN',s:x=>new Date(x.last_seen).getTime(),r:x=>tm(x.last_seen),cls:'nw'},{h:'STATUS',s:x=>x.status,r:x=>`<span class="pill ${x.status==='ACTIVE'?'g':'x'}">${esc(x.status)}</span>`}]});
 T.set(ALL)}
window.onRefresh=load;load();
</script></body></html>
