<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-ISF | Threat Intel</title><link rel="stylesheet" href="xdr.css"></head><body><script src="xdr.js"></script><script>
shell('Threat Intel','Threat Intelligence','Observed threats from your telemetry plus live vulnerability intelligence',`
<div id="feed"><div class="grid g2" style="margin-top:0"><div class="panel"><div class="ph"><div><h2>Notifications</h2><div class="sub">High-risk events &amp; case actions</div></div><span class="status"><i class="dot"></i> LIVE</span></div><div id="notes" class="pad"><div class="skel"></div></div></div>
<div class="panel"><div class="ph"><div><h2>CISA Known Exploited Vulnerabilities</h2><div class="sub">Newest additions · live from CISA</div></div><a class="btn sm" target="_blank" rel="noopener" href="https://www.cisa.gov/known-exploited-vulnerabilities-catalog">Open catalog ↗</a></div><div id="kev" class="pad"><div class="skel"></div></div></div></div>
<div class="panel"><div class="ph"><div><h2>Observed Threat Patterns</h2><div class="sub">Derived only from your real authentication evidence</div></div></div><div id="tPat"></div></div></div>
`);
let T;
async function load(){const [d,n,k]=await Promise.all([getJSON('/api/threat-research'),getJSON('/api/threat-research/notifications'),getJSON('/api/threat-research/kev')]);
 if(!T)T=DT({mount:'tPat',size:8,id:x=>x.type+x.risk_level,onRow:x=>location.href='detections.html?q='+encodeURIComponent(x.type),empty:'<div class="big">✓</div><strong>No medium or high-risk patterns observed</strong>Your telemetry looks clean.',cols:[{h:'TYPE',s:x=>x.type,r:x=>`<div class="t1">${esc(x.type)}</div>`},{h:'LEVEL',s:x=>x.risk_level,r:x=>sevPill(x.risk_level)},{h:'EVIDENCE',r:x=>`<div class="t2" style="max-width:420px;white-space:normal">${esc(x.evidence)}</div>`},{h:'EVENTS',s:x=>x.events,r:x=>`<span class="mono">${x.events}</span>`},{h:'LAST SEEN',s:x=>new Date(x.last_seen).getTime(),r:x=>tm(x.last_seen),cls:'nw'},{h:'',r:()=>`<span class="btn sm">Review</span>`}]});
 T.set(d?.findings||[]);
 const nt=n?.notifications||[];$('notes').innerHTML=nt.slice(0,7).map(x=>`<div style="display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--border);align-items:flex-start"><span class="dot ${x.type==='CASE'?'':'bad'}" style="margin-top:5px"></span><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:12.5px">${esc(x.event_type)} ${x.type==='THREAT'?`<span class="pill r">RISK ${Number(x.risk_score||0).toFixed(0)}</span>`:'<span class="pill v">CASE ACTION</span>'}</div><div class="muted" style="font-size:11px;margin-top:3px">${esc(String(x.detail||'').slice(0,110))}</div></div><span class="muted mono" style="font-size:10px;white-space:nowrap">${ago(x.timestamp)}</span></div>`).join('')||'<div class="empty" style="padding:26px"><div class="big">✓</div><strong>No notifications</strong>No high-risk events or case actions.</div>';
 const kv=(k?.vulnerabilities||[]).slice().sort((a,b)=>String(b.dateAdded).localeCompare(String(a.dateAdded))).slice(0,6);$('kev').innerHTML=kv.map(x=>`<a target="_blank" rel="noopener" href="https://nvd.nist.gov/vuln/detail/${encodeURIComponent(x.cveID||'')}" class="hit" style="margin:0 0 9px"><b class="mono" style="color:var(--amber)">${esc(x.cveID||x.vulnerabilityName)}</b><span class="muted mono" style="float:right;font-size:10px">${esc(x.dateAdded||'')}</span><div>${esc(x.vendorProject||'')} · ${esc(x.product||'')}</div></a>`).join('')||'<div class="empty" style="padding:26px"><strong>Live CISA data unavailable</strong>Check your internet connection, or open the catalog directly.</div>'}
window.onRefresh=load;load();
</script></body></html>
