<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-ISF | Audit Logs</title><link rel="stylesheet" href="xdr.css"></head><body><script src="xdr.js"></script><script>
shell('Audit Logs','Audit Logs','Unified trail of authentication events and every recorded platform action',`
<div class="panel"><div class="pad" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--border)"><input id="lq" class="fi" style="flex:1;min-width:200px;max-width:340px" placeholder="Filter event, description, result…" autocomplete="off"><div style="display:flex;gap:6px" id="lSrc"><button class="chip on" data-v="">All</button><button class="chip" data-v="AUDIT">Platform actions</button><button class="chip" data-v="AUTHENTICATION">Authentication</button></div><span style="flex:1"></span><span id="lCount" class="muted mono" style="font-size:11px"></span><a class="btn" href="/api/download/audit.csv">${ic('download')} Export</a></div><div id="tLog"></div></div>`);
let ROWS=[],T,SRC='';
function pred(x){const q=$('lq').value.trim().toLowerCase();if(SRC&&x.source!==SRC)return false;return !q||[x.event,x.status,x.detail,x.source].join(' ').toLowerCase().includes(q)}
function drawer(x){openDrawer(x.event,`<div style="margin-bottom:16px"><span class="pill ${x.source==='AUDIT'?'a':'b'}">${esc(x.source)}</span></div><dl class="kv"><dt>Time</dt><dd>${fmt(x.timestamp)}</dd><dt>Status</dt><dd>${esc(x.status||'—')}</dd><dt>Risk</dt><dd>${x.risk==null?'—':riskBar(x.risk)}</dd><dt>Detail</dt><dd>${esc(x.detail||'—')}</dd></dl>`)}
async function load(){const [a,e]=await Promise.all([getJSON('/api/audit-logs?limit=500'),getJSON('/api/events?limit=500')]);
 ROWS=[...(a?.logs||[]).map(x=>({id:'A'+x.id,timestamp:x.timestamp,source:'AUDIT',event:x.event_type,status:'RECORDED',detail:x.description})),...(e?.events||[]).map(x=>({id:x.id,timestamp:x.timestamp,source:'AUTHENTICATION',event:x.event_type,status:x.result,risk:x.risk,detail:x.detail}))].sort((p,q)=>new Date(q.timestamp)-new Date(p.timestamp));
 if(!T)T=DT({mount:'tLog',size:15,id:x=>x.id,sort:0,dir:-1,onRow:drawer,onCount:(v,t)=>$('lCount').textContent=`${v} of ${t} records`,empty:'<div class="big">◌</div><strong>No matching records</strong>',cols:[{h:'TIME',s:x=>new Date(x.timestamp).getTime(),r:x=>tm(x.timestamp),cls:'nw'},{h:'SOURCE',s:x=>x.source,r:x=>`<span class="pill ${x.source==='AUDIT'?'a':'b'}">${x.source==='AUDIT'?'PLATFORM':'AUTH'}</span>`},{h:'EVENT',s:x=>x.event,r:x=>`<div class="t1">${esc(x.event)}</div>`},{h:'STATUS',s:x=>x.status||'',r:x=>x.source==='AUDIT'?'<span class="muted mono" style="font-size:11px">RECORDED</span>':resPill(x.status)},{h:'RISK',s:x=>x.risk==null?-1:Number(x.risk),r:x=>x.risk==null?'<span class="muted">—</span>':riskBar(x.risk)},{h:'DETAIL',r:x=>`<div class="t2" style="max-width:380px">${esc(x.detail||'')}</div>`}]});
 T.set(ROWS);T.filter(pred)}
$('lq').oninput=()=>T&&T.filter(pred);$$('#lSrc .chip').forEach(c=>c.onclick=()=>{SRC=c.dataset.v;$$('#lSrc .chip').forEach(x=>x.classList.toggle('on',x===c));T&&T.filter(pred)});
window.onRefresh=load;load();
</script></body></html>
