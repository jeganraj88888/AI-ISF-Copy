<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-ISF | Advanced Search</title><link rel="stylesheet" href="xdr.css"></head><body><script src="xdr.js"></script><script>
shell('Advanced Search','Advanced Search','Query and export your real authentication telemetry',`
<div class="panel hud"><i></i><i></i><i></i><i></i><div class="pad">
 <div style="display:flex;gap:10px;flex-wrap:wrap"><input id="sq" class="fi" style="flex:1;min-width:240px" placeholder="Search anything: failed logins, an IP, a host, an OS, a keyword…" autocomplete="off"><button class="btn primary" id="sGo">${ic('search')} Search</button><button class="btn" id="sFil">Filters ▾</button><button class="btn ghost" id="sReset">Reset</button></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px" id="presets"><span class="muted mono" style="font-size:10px;letter-spacing:1.2px;align-self:center">PRESETS</span><button class="chip" data-p="failed_24h">Failed logins · 24h</button><button class="chip" data-p="high_risk">High-risk · ≥71</button><button class="chip" data-p="face_failures">Face failures</button><button class="chip" data-p="password_failures">Password failures</button><button class="chip" data-p="new_device">New device</button></div>
 <div id="builder" style="display:none;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)"><div class="grid g4" style="margin-top:0"><div><label class="l">Event type</label><select id="fType" class="fi"><option value="">All</option><option>Authentication</option><option>Password Authentication</option><option>Face Identity Verification</option></select></div><div><label class="l">Min risk</label><input id="fRisk" class="fi" type="number" min="0" max="100" placeholder="e.g. 71"></div><div><label class="l">Last N hours</label><input id="fHours" class="fi" type="number" min="1" placeholder="e.g. 24"></div><div><label class="l">Operating system</label><select id="fOs" class="fi"><option value="">All</option><option>Windows</option><option>macOS</option><option>Linux</option><option>Android</option><option>iOS</option><option>Unknown</option></select></div><div><label class="l">IP</label><input id="fIp" class="fi" placeholder="IP address"></div><div><label class="l">Host</label><input id="fHost" class="fi" placeholder="Host"></div><div><label class="l">Endpoint</label><input id="fEnd" class="fi" placeholder="/api/login"></div></div></div></div></div>
<div class="panel"><div class="ph"><div><h2>Results</h2><div class="sub" id="sCount">Run a search to see records</div></div><div style="display:flex;gap:8px"><button class="btn" id="xCsv">${ic('download')} CSV</button><button class="btn" id="xJson">${ic('download')} JSON</button></div></div><div id="tRes"></div></div>`);
let PRE='',T;const evId=n=>'EVT-'+String(n).padStart(6,'0');
function params(){const p=new URLSearchParams(),o={q:$('sq').value.trim(),preset:PRE};if($('builder').style.display!=='none')Object.assign(o,{event_type:$('fType').value,risk_min:$('fRisk').value,since_hours:$('fHours').value,os:$('fOs').value,ip:$('fIp').value.trim(),host:$('fHost').value.trim(),endpoint:$('fEnd').value.trim()});Object.entries(o).forEach(([k,v])=>{if(v!==''&&v!=null)p.set(k,v)});return p}
function drawer(x){openDrawer(x.event_type,`<div style="display:flex;gap:8px;margin-bottom:16px">${sevPill(x.risk_level)}${resPill(x.result)}</div><dl class="kv"><dt>ID</dt><dd class="mono">${evId(x.id)}</dd><dt>Time</dt><dd>${fmt(x.timestamp)}</dd><dt>Risk</dt><dd>${riskBar(x.risk_score)}</dd><dt>IP</dt><dd class="mono">${esc(x.ip_address||'Unknown')}</dd><dt>Host</dt><dd>${esc(x.host_name||'Unknown')}</dd><dt>Endpoint</dt><dd class="mono">${esc(x.endpoint||'Unknown')}</dd><dt>OS</dt><dd>${esc(x.os_name||'Unknown')}</dd><dt>Location</dt><dd>${esc(x.location||'Unknown')}</dd><dt>Detail</dt><dd>${esc(x.detail||'')}</dd></dl><div style="margin-top:22px"><a class="btn primary" href="detections.html?q=${evId(x.id)}">Open in Detections →</a></div>`,evId(x.id))}
async function run(){const d=await getJSON('/api/search/advanced?'+params());const r=d?.results||[];$('sCount').textContent=`${r.length} record${r.length===1?'':'s'} found`;T.set(r)}
T=DT({mount:'tRes',size:12,id:x=>x.id,sort:1,dir:-1,onRow:drawer,empty:'<div class="big">◌</div><strong>No matching records</strong>Try a different keyword or clear the filters.',
 cols:[{h:'ID',s:x=>x.id,r:x=>`<span class="mono" style="color:var(--cyan)">${evId(x.id)}</span>`,cls:'nw'},{h:'TIME',s:x=>new Date(x.timestamp).getTime(),r:x=>tm(x.timestamp),cls:'nw'},{h:'EVENT',s:x=>x.event_type,r:x=>`<div class="t1">${esc(x.event_type)}</div><div class="t2">${esc(x.detail||'')}</div>`},{h:'RESULT',s:x=>x.result,r:x=>resPill(x.result)},{h:'RISK',s:x=>Number(x.risk_score),r:x=>riskBar(x.risk_score)},{h:'DEVICE',s:x=>x.os_name||'',r:x=>`<div>${esc(x.os_name||'Unknown')}</div><div class="t2 mono">${esc(x.ip_address||'Unknown')}</div>`}]});
$('sGo').onclick=run;$('sq').onkeydown=e=>{if(e.key==='Enter')run()};$('sFil').onclick=()=>{const b=$('builder'),o=b.style.display==='none';b.style.display=o?'block':'none';$('sFil').textContent=o?'Filters ▴':'Filters ▾'};
$$('#presets .chip').forEach(c=>c.onclick=()=>{PRE=PRE===c.dataset.p?'':c.dataset.p;$$('#presets .chip').forEach(x=>x.classList.toggle('on',x.dataset.p===PRE));run()});
$('sReset').onclick=()=>{PRE='';$$('#presets .chip').forEach(x=>x.classList.remove('on'));$$('#builder .fi').forEach(x=>x.value='');$('sq').value='';run()};
const exp=f=>location.href='/api/search/advanced/export?format='+f+'&'+params();$('xCsv').onclick=()=>exp('csv');$('xJson').onclick=()=>exp('json');
window.onRefresh=run;const pq=new URLSearchParams(location.search);if(pq.get('q'))$('sq').value=pq.get('q');if(pq.get('preset')){PRE=pq.get('preset');$$('#presets .chip').forEach(x=>x.classList.toggle('on',x.dataset.p===PRE))}run();
</script></body></html>
