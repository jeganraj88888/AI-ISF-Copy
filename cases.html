<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-ISF | Cases</title><link rel="stylesheet" href="xdr.css"></head><body><script src="xdr.js"></script><script>
shell('Cases','Cases','Triage records created from real detections',`
<div class="grid g3"><div class="stat s-cyan"><div class="ico">${ic('brief')}</div><div class="lab">Total cases</div><div class="num" id="cTot">—</div><div class="sub">raised from detections</div></div><div class="stat s-red"><div class="ico">${ic('alert')}</div><div class="lab">Open</div><div class="num" id="cOpen">—</div><div class="sub">awaiting triage</div></div><div class="stat s-green"><div class="ico">${ic('check')}</div><div class="lab">Resolved</div><div class="num" id="cRes">—</div><div class="sub" id="cSub">&nbsp;</div></div></div>
<div class="panel"><div class="pad" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--border)"><input id="cq" class="fi" style="flex:1;min-width:200px;max-width:340px" placeholder="Search case, detection, notes…" autocomplete="off"><div style="display:flex;gap:6px" id="cSt"><button class="chip on" data-v="">All</button><button class="chip" data-v="OPEN">Open</button><button class="chip" data-v="RESOLVED">Resolved</button></div><span style="flex:1"></span><span id="cCount" class="muted mono" style="font-size:11px"></span><a class="btn" href="/api/download/cases.csv">${ic('download')} CSV</a></div><div id="tCases"></div></div>`);
let ALL=[],T,ST='';
const cid=x=>'CASE-'+String(x.id).padStart(5,'0');
function pred(x){const q=$('cq').value.trim().toLowerCase();if(ST&&x.status!==ST)return false;return !q||[cid(x),x.event_type,x.closing_notes,x.resolution_status,x.reason,x.ip_address,x.os_name,x.result].join(' ').toLowerCase().includes(q)}
function drawer(x){openDrawer(cid(x),`<div style="display:flex;gap:8px;margin-bottom:16px">${statusPill(x.status,x.resolution_status)}<span class="pill x">RISK ${Number(x.risk_score||0).toFixed(0)}</span></div><dl class="kv"><dt>Detection</dt><dd>${esc(x.event_type||'—')} ${resPill(x.result)}</dd><dt>Reason</dt><dd>${esc(x.reason||'—')}</dd><dt>Created</dt><dd>${fmt(x.created_at)}</dd><dt>Resolved</dt><dd>${x.resolved_at?fmt(x.resolved_at):'—'}</dd><dt>Resolution</dt><dd>${esc(RESL[x.resolution_status]||'Open')}</dd><dt>Closing notes</dt><dd>${esc(x.closing_notes||'—')}</dd><dt>IP</dt><dd class="mono">${esc(x.ip_address||'—')}</dd><dt>Host</dt><dd>${esc(x.host_name||'—')}</dd><dt>OS</dt><dd>${esc(x.os_name||'—')}</dd></dl><div style="margin-top:22px"><button class="btn primary" id="cwUp">Update status</button></div>`,'EVT-'+String(x.event_id).padStart(6,'0'));$('cwUp').onclick=()=>{closeAll();openTriage([x.event_id],load,x.resolution_status||'OPEN')}}
async function load(){const d=await getJSON('/api/cases');ALL=d?.cases||[];const open=ALL.filter(x=>x.status==='OPEN').length;$('cTot').textContent=ALL.length;$('cOpen').textContent=open;$('cRes').textContent=ALL.length-open;$('cSub').textContent=ALL.length?Math.round((ALL.length-open)/ALL.length*100)+'% closure rate':'no cases yet';
 if(!T)T=DT({mount:'tCases',size:12,id:x=>x.id,sort:0,dir:-1,onRow:drawer,onCount:(v,t)=>$('cCount').textContent=`${v} of ${t} cases`,empty:'<div class="big">✓</div><strong>No cases yet</strong>Cases appear when a detection reaches high risk, or when you triage one.',
  cols:[{h:'CASE',s:x=>x.id,r:x=>`<span class="mono" style="color:var(--cyan)">${cid(x)}</span>`,cls:'nw'},{h:'CREATED',s:x=>new Date(x.created_at).getTime(),r:x=>tm(x.created_at),cls:'nw'},{h:'DETECTION',s:x=>x.event_type||'',r:x=>`<div class="t1">${esc(x.event_type||'—')}</div><div class="t2">${esc(x.closing_notes||x.reason||'')}</div>`},{h:'RISK',s:x=>Number(x.risk_score),r:x=>riskBar(x.risk_score)},{h:'STATUS',s:x=>x.status,r:x=>statusPill(x.status,x.resolution_status)},{h:'',r:x=>`<button class="btn sm ${x.status==='OPEN'?'primary':''}" data-up="${x.event_id}">${x.status==='OPEN'?'Resolve':'Update'}</button>`,cls:'nw'}]});
 T.set(ALL);T.filter(pred)}
$('tCases')&&$('tCases').addEventListener('click',e=>{const b=e.target.closest('[data-up]');if(b){const x=ALL.find(r=>String(r.event_id)===b.dataset.up);openTriage([b.dataset.up],load,x?.resolution_status||'OPEN')}});
$('cq').oninput=()=>T&&T.filter(pred);$$('#cSt .chip').forEach(c=>c.onclick=()=>{ST=c.dataset.v;$$('#cSt .chip').forEach(x=>x.classList.toggle('on',x===c));T&&T.filter(pred)});
window.onRefresh=load;load();
</script></body></html>
