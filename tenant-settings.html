<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-ISF | Workspace</title><link rel="stylesheet" href="xdr.css"></head><body><script src="xdr.js"></script><script>
shell('Workspace','Workspace','Host-owned tenant workspaces — they never create extra login users',`
<div class="grid g2" style="margin-top:0">
 <div class="panel hud"><i></i><i></i><i></i><i></i><div class="ph"><div><h2>Host Tenant</h2><div class="sub">Your current owner environment</div></div><span class="status"><i class="dot"></i> ACTIVE</span></div><div class="pad" id="owner"><div class="skel"></div></div></div>
 <div class="panel"><div class="ph"><div><h2>Add Tenant</h2><div class="sub">Create a workspace owned by this host account</div></div></div><div class="pad"><label class="l">Tenant name</label><input id="tName" class="fi" maxlength="80" placeholder="e.g. Final Year Demo" style="margin-bottom:14px"><label class="l">Purpose / notes</label><textarea id="tNotes" class="fi" maxlength="500" placeholder="What is this workspace for?" style="margin-bottom:14px"></textarea><button class="btn primary" id="tAdd">${ic('plus')} Add tenant</button></div></div>
</div>
<div class="panel"><div class="ph"><div><h2>Tenant Workspaces</h2><div class="sub" id="tCount"></div></div></div><div id="tTen"></div></div>`);
let T;
async function load(){const d=await getJSON('/api/tenant');if(!d||!d.tenant)return;const t=d.tenant;$('owner').innerHTML=`<div style="font-size:17px;font-weight:800">${esc(t.name)}</div><div class="muted" style="margin:4px 0 16px">${esc(t.owner?.email||'')}</div><div class="grid g3" style="margin-top:0"><div><div class="muted mono" style="font-size:10px;letter-spacing:1px">EVENTS</div><div class="mono" style="font-size:22px;color:var(--cyan)">${t.events}</div></div><div><div class="muted mono" style="font-size:10px;letter-spacing:1px">CASES</div><div class="mono" style="font-size:22px;color:var(--violet)">${t.cases??'—'}</div></div><div><div class="muted mono" style="font-size:10px;letter-spacing:1px">USERS</div><div class="mono" style="font-size:22px;color:var(--green)">${t.users}</div></div></div><div style="margin-top:16px"><span class="pill g">${esc(t.data_mode)}</span></div>`;
 const rows=d.tenants||[];$('tCount').textContent=`${rows.length} workspace${rows.length===1?'':'s'}`;
 if(!T)T=DT({mount:'tTen',size:10,id:x=>x.id,sort:3,dir:-1,empty:'<div class="big">◌</div><strong>No additional workspaces yet</strong>Add one with the form above.',cols:[{h:'NAME',s:x=>x.name,r:x=>`<div class="t1">${esc(x.name)}</div>`},{h:'TENANT ID',s:x=>x.tenant_key,r:x=>`<span class="mono" style="color:var(--cyan)">${esc(x.tenant_key)}</span>`},{h:'STATUS',s:x=>x.status,r:x=>`<span class="pill g">${esc(x.status)}</span>`},{h:'CREATED',s:x=>new Date(x.created_at).getTime(),r:x=>tm(x.created_at),cls:'nw'},{h:'NOTES',r:x=>`<div class="t2" style="max-width:360px">${esc(x.notes||'')}</div>`}],onRow:x=>openDrawer(x.name,`<dl class="kv"><dt>Tenant ID</dt><dd class="mono">${esc(x.tenant_key)}</dd><dt>Status</dt><dd>${esc(x.status)}</dd><dt>Created</dt><dd>${fmt(x.created_at)}</dd><dt>Notes</dt><dd>${esc(x.notes||'—')}</dd></dl>`)});
 T.set(rows)}
$('tAdd').onclick=async()=>{const name=$('tName').value.trim();if(name.length<2)return toast('Enter a tenant name (2+ characters)','err');$('tAdd').disabled=true;const d=await post('/api/tenant',{name,notes:$('tNotes').value.trim()});$('tAdd').disabled=false;if(d?.success){toast(`Tenant created · ${d.tenant_key||''}`,'ok');$('tName').value='';$('tNotes').value='';load()}else toast(d?.message||'Could not create tenant','err')};
$('tName').onkeydown=e=>{if(e.key==='Enter')$('tAdd').click()};
window.onRefresh=load;load();
</script></body></html>
