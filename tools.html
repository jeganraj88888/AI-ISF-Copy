<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-ISF | Tools</title><link rel="stylesheet" href="xdr.css"></head><body><script src="xdr.js"></script><script>
shell('Tools','Tools','CTI and operational utilities for security investigation',`
<div class="grid g2" style="margin-top:0">
 <div class="panel"><div class="ph"><div><h2>What is my IP?</h2><div class="sub">Public address seen from the internet</div></div></div><div class="pad"><div class="mono" id="myIp" style="font-size:28px;color:var(--cyan);text-shadow:0 0 22px rgba(34,211,238,.4)">—</div><div class="muted" id="ipNote" style="font-size:11px;margin:6px 0 14px">Click to detect.</div><button class="btn primary" id="ipBtn">Check IP</button> <button class="btn" id="ipCopy">Copy</button></div></div>
 <div class="panel"><div class="ph"><div><h2>VirusTotal</h2><div class="sub">IP, domain, URL or file-hash reputation</div></div></div><div class="pad"><div style="display:flex;gap:8px"><input class="fi" id="vtIoc" placeholder="8.8.8.8 / domain / URL / SHA256"><button class="btn primary" id="vtBtn">Lookup</button></div><div id="vtOut" style="margin-top:14px" class="muted">Enter an indicator to query VirusTotal API v3.</div></div></div>
 <div class="panel"><div class="ph"><div><h2>RDAP / Domain Registration</h2><div class="sub">Authoritative registration data where available</div></div></div><div class="pad"><div style="display:flex;gap:8px"><input class="fi" id="domain" placeholder="example.com"><button class="btn primary" id="rdapBtn">Lookup</button></div><div id="rdapOut" style="margin-top:14px" class="muted">Enter a domain name.</div></div></div>
 <div class="panel"><div class="ph"><div><h2>CTI Quick Links</h2><div class="sub">External analyst resources</div></div></div><div class="pad" style="display:flex;flex-wrap:wrap;gap:9px"><a class="btn" target="_blank" rel="noopener" href="https://www.virustotal.com/">VirusTotal ↗</a><a class="btn" target="_blank" rel="noopener" href="https://urlhaus.abuse.ch/">URLhaus ↗</a><a class="btn" target="_blank" rel="noopener" href="https://otx.alienvault.com/">AlienVault OTX ↗</a><a class="btn" target="_blank" rel="noopener" href="https://www.abuseipdb.com/">AbuseIPDB ↗</a><a class="btn" target="_blank" rel="noopener" href="https://attack.mitre.org/">MITRE ATT&amp;CK ↗</a><a class="btn" target="_blank" rel="noopener" href="https://www.cisa.gov/known-exploited-vulnerabilities-catalog">CISA KEV ↗</a></div><div class="pad muted" style="padding-top:0;font-size:11px">No fake results are shown inside AI-ISF. VirusTotal needs a <span class="mono">VT_API_KEY</span> in the server environment and is rate-limited — don't query sensitive or private indicators.</div></div>
</div>
<div class="panel"><div class="ph"><div><h2>AI-ISF Model &amp; System</h2><div class="sub">Real component status</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="modelBtn">Model status</button><button class="btn" id="diagBtn">Diagnostics</button><button class="btn" id="sysBtn">System</button></div></div><div class="pad" id="sysOut"><div class="empty" style="padding:26px"><div class="big">◎</div><strong>No check run yet</strong>Pick a check above to view real component status.</div></div></div>`);
$('ipBtn').onclick=async()=>{$('myIp').textContent='…';try{const r=await fetch('https://api.ipify.org?format=json',{cache:'no-store'});const d=await r.json();$('myIp').textContent=d.ip||'Unavailable';$('ipNote').textContent='Public internet address (via ipify)'}catch(_){const d=await getJSON('/api/tools/my-ip');$('myIp').textContent=d?.ip||'Unavailable';$('ipNote').textContent='Server-visible address — behind NAT/proxy this can differ from your public IP'}};
$('ipCopy').onclick=()=>{const t=$('myIp').textContent;if(t&&t!=='—'&&t!=='…'&&navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('IP copied','ok'))};
const raw=d=>`<details style="margin-top:12px"><summary class="muted" style="cursor:pointer;font-size:11px">Raw response</summary><pre class="out">${esc(JSON.stringify(d,null,2))}</pre></details>`;
$('vtBtn').onclick=async()=>{const i=$('vtIoc').value.trim();if(!i)return toast('Enter an indicator','err');$('vtOut').innerHTML='<div class="skel"></div>';const d=await getJSON('/api/tools/virustotal?indicator='+encodeURIComponent(i));
 if(!d)return $('vtOut').textContent='No response from backend.';if(d.configured===false)return $('vtOut').innerHTML=`<div class="pill a" style="margin-bottom:8px">NOT CONFIGURED</div><div style="font-size:12.5px">Add <span class="mono">VT_API_KEY=your_key</span> to your environment (.env) and restart <span class="mono">app.py</span>. The key is never stored in the browser.</div>`;
 if(!d.success)return $('vtOut').innerHTML=`<div class="pill r">FAILED</div> <span style="font-size:12.5px">${esc(d.message||'Request failed (HTTP '+d.status_code+')')}</span>`;
 const it=d.data?.data?.[0],st=it?.attributes?.last_analysis_stats;$('vtOut').innerHTML=st?`<div style="display:flex;gap:8px;flex-wrap:wrap"><span class="pill r">${st.malicious||0} malicious</span><span class="pill a">${st.suspicious||0} suspicious</span><span class="pill g">${st.harmless||0} harmless</span><span class="pill x">${st.undetected||0} undetected</span></div><div class="muted" style="font-size:11px;margin-top:8px">${esc(it.type||'')} · ${esc(String(it.id||'').slice(0,60))}</div>${raw(d.data)}`:`<div class="muted">No VirusTotal record found for this indicator.</div>${raw(d.data)}`};
$('rdapBtn').onclick=async()=>{const v=$('domain').value.trim();if(!v)return toast('Enter a domain','err');$('rdapOut').innerHTML='<div class="skel"></div>';const d=await getJSON('/api/tools/rdap?domain='+encodeURIComponent(v));if(!d)return $('rdapOut').textContent='No response from backend.';if(!d.success)return $('rdapOut').innerHTML=`<div class="pill r">FAILED</div> <span style="font-size:12.5px">${esc(d.message||'Lookup failed (HTTP '+d.status_code+')')}</span>`;
 const r=d.data||{},ev=a=>(r.events||[]).find(e=>e.eventAction===a)?.eventDate,reg=(r.entities||[]).find(e=>(e.roles||[]).includes('registrar')),rn=reg?.vcardArray?.[1]?.find(x=>x[0]==='fn')?.[3];
 $('rdapOut').innerHTML=`<dl class="kv"><dt>Domain</dt><dd class="mono">${esc(r.ldhName||v)}</dd><dt>Status</dt><dd>${(r.status||[]).map(s=>`<span class="pill b" style="margin:0 4px 4px 0">${esc(s)}</span>`).join('')||'—'}</dd><dt>Registrar</dt><dd>${esc(rn||'—')}</dd><dt>Registered</dt><dd>${ev('registration')?fmt(ev('registration')):'—'}</dd><dt>Expires</dt><dd>${ev('expiration')?fmt(ev('expiration')):'—'}</dd><dt>Nameservers</dt><dd class="mono">${(r.nameservers||[]).map(n=>esc(n.ldhName)).join('<br>')||'—'}</dd></dl>${raw(d.data)}`};
$('vtIoc').onkeydown=e=>{if(e.key==='Enter')$('vtBtn').click()};$('domain').onkeydown=e=>{if(e.key==='Enter')$('rdapBtn').click()};
/* model / diagnostics / system */
const bar=(l,v)=>{const c=v>=85?'#fb7185':v>=60?'#fbbf24':'#34d399';return `<div class="bar-row"><div class="t"><span class="muted">${l}</span><b class="mono">${v==null?'n/a':v.toFixed(0)+'%'}</b></div><div class="progress"><i style="width:${v||0}%;background:${c}"></i></div></div>`};
async function check(kind,btn){btn.disabled=true;$('sysOut').innerHTML='<div class="skel" style="height:90px"></div>';const u={model:'/api/model/status',diag:'/api/diagnostics',sys:'/api/system'}[kind];const t=performance.now();const d=await getJSON(u);btn.disabled=false;if(!d)return $('sysOut').innerHTML='<div class="empty"><strong>No response</strong>Is the backend running?</div>';const ms=Math.round(performance.now()-t);let h='';
 if(kind==='model'){const need=d.minimum_events||20,have=d.real_event_count||0;h=`<div style="display:flex;gap:10px;align-items:center;margin-bottom:12px"><b>Isolation Forest</b><span class="pill ${d.trained?'g':'a'}">${esc(String(d.status||'').replace('_',' '))}</span></div><div class="progress"><i style="width:${Math.min(100,have/need*100)}%"></i></div><div class="muted mono" style="margin:7px 0 0;font-size:11px">${have} / ${need} real events${d.metadata?.trained_at?' · trained '+ago(d.metadata.trained_at):''}</div>`}
 else if(kind==='diag'){const ch=Object.entries(d.checks||{});h=`<div class="grid g4" style="margin-top:0">${ch.map(([k,v])=>`<div style="padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--hover);display:flex;align-items:center;justify-content:space-between;gap:8px"><span style="font-size:12.5px;font-weight:700">${esc(k.replace(/_/g,' '))}</span>${typeof v==='boolean'?`<span class="pill ${v?'g':'r'}">${v?'OK':'MISSING'}</span>`:`<span class="mono muted" style="font-size:11px">${esc(String(v))}</span>`}</div>`).join('')}</div>`}
 else{h=`<div class="muted mono" style="font-size:11px;margin-bottom:12px">${esc(d.hostname||'')}</div>${bar('CPU',d.cpu_percent)}${bar('Memory',d.memory_percent)}${bar('Disk',d.disk_percent)}`}
 $('sysOut').innerHTML=h+raw(d)+`<div class="muted mono" style="font-size:10px;margin-top:10px">Responded in ${ms} ms</div>`}
$('modelBtn').onclick=()=>check('model',$('modelBtn'));$('diagBtn').onclick=()=>check('diag',$('diagBtn'));$('sysBtn').onclick=()=>check('sys',$('sysBtn'));
</script></body></html>
