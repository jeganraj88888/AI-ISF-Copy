<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-ISF | Risk Lab</title><link rel="stylesheet" href="xdr.css"></head><body><script src="xdr.js"></script><script>
shell('Risk Lab','Risk Lab','Test the hybrid rule + Isolation Forest engine — read-only, nothing is recorded',`
<div class="grid g12" style="margin-top:0">
 <div class="panel"><div class="ph"><h2>Scenario</h2></div><div class="pad">
  <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px" id="sc"><button class="chip" data-s="normal">Normal login</button><button class="chip" data-s="fails">5 failed attempts</button><button class="chip" data-s="device">Unknown device</button><button class="chip" data-s="worst">Everything wrong</button></div>
  <label class="l">Location / timezone</label><input id="sLoc" class="fi" style="margin-bottom:14px" value="Asia/Kolkata">
  <label class="l">Device ID (blank = this browser)</label><input id="sDev" class="fi" style="margin-bottom:14px" placeholder="e.g. unknown-laptop-77">
  <label class="l">Failed attempts · <b id="sFv" style="color:var(--cyan)">0</b></label><input id="sFail" type="range" min="0" max="10" value="0" style="width:100%;accent-color:var(--cyan);margin-bottom:20px">
  <button class="btn primary" id="sRun" style="width:100%;justify-content:center">${ic('bolt')} Analyze risk</button></div></div>
 <div class="panel hud"><i></i><i></i><i></i><i></i><div class="ph"><h2>Analysis</h2><span id="sLvl"></span></div><div class="pad" id="sOut"><div class="empty"><div class="big">◎</div><strong>No analysis yet</strong>Pick a scenario or set your own values, then press Analyze.</div></div></div>
</div>
<div class="panel"><div class="ph"><div><h2>How the score is built</h2><div class="sub">Points are added per signal (capped at 100). 31–70 = MEDIUM · 71+ = HIGH → alert / case</div></div></div><div class="pad"><div class="grid g4" style="margin-top:0" id="rules"></div></div></div>`);
const RULES=[['Multiple failed attempts','5+ failures in 15 min',35,'#fb7185'],['Repeated failed attempts','3–4 failures',20,'#fb7185'],['New device','device ID never seen',18,'#fbbf24'],['New location','timezone never seen',18,'#fbbf24'],['Unusual login time','23:00–05:59 UTC',12,'#8b5cf6'],['High authentication frequency','10+ events today',12,'#8b5cf6'],['ML anomaly detected','Isolation Forest outlier',20,'#22d3ee']];
$('rules').innerHTML=RULES.map(r=>`<div style="padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--hover)"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:12.5px">${r[0]}</b><b class="mono" style="color:${r[3]}">+${r[2]}</b></div><div class="muted" style="font-size:11px;margin:4px 0 8px">${r[1]}</div><div class="progress" style="height:5px"><i style="width:${r[2]/35*100}%;background:${r[3]}"></i></div></div>`).join('');
const PTS=Object.fromEntries(RULES.map(r=>[r[0],[r[2],r[3]]]));
$('sFail').oninput=()=>$('sFv').textContent=$('sFail').value;
const SC={normal:{loc:'Asia/Kolkata',dev:'',fail:0},fails:{loc:'Asia/Kolkata',dev:'',fail:5},device:{loc:'Asia/Kolkata',dev:'sim-unknown-'+Math.random().toString(36).slice(2,8),fail:0},worst:{loc:'Atlantis/Unknown',dev:'sim-attacker-'+Math.random().toString(36).slice(2,8),fail:6}};
$$('#sc .chip').forEach(c=>c.onclick=()=>{const s=SC[c.dataset.s];$('sLoc').value=s.loc;$('sDev').value=s.dev;$('sFail').value=s.fail;$('sFv').textContent=s.fail;$$('#sc .chip').forEach(x=>x.classList.toggle('on',x===c));run()});
async function run(){$('sOut').innerHTML='<div class="skel" style="height:140px"></div>';$('sRun').disabled=true;
 const d=await post('/api/risk/analyze',{location:$('sLoc').value.trim()||'Unknown',device_id:$('sDev').value.trim()||localStorage.getItem('aisf_device_id')||'browser',failed_attempts:+$('sFail').value||0});$('sRun').disabled=false;if(!d||d.risk_score==null){$('sOut').innerHTML='<div class="empty"><strong>Analysis failed</strong>Is the backend running?</div>';return}
 const c=d.risk_level==='HIGH'?'r':d.risk_level==='MEDIUM'?'a':'g';$('sLvl').innerHTML=`<span class="pill ${c}">${d.risk_level}</span> <span class="pill b">${d.recommended_action}</span>`;
 const fired=(d.reasons||[]).filter(r=>PTS[r]);
 $('sOut').innerHTML=`<div style="display:grid;grid-template-columns:minmax(200px,260px) 1fr;gap:26px;align-items:center"><div class="gaugebox">${CH.gauge(d.risk_score,'RISK SCORE / 100')}</div><div><label class="l">Contributing signals</label>${fired.length?fired.map(r=>`<div class="bar-row"><div class="t"><span>${esc(r)}</span><b class="mono" style="color:${PTS[r][1]}">+${PTS[r][0]}</b></div><div class="progress" style="height:6px"><i style="width:${PTS[r][0]/35*100}%;background:${PTS[r][1]}"></i></div></div>`).join(''):`<div class="pill g">${esc((d.reasons||['Known authentication pattern'])[0])}</div>`}<details style="margin-top:12px"><summary class="muted" style="cursor:pointer;font-size:11px">Model features</summary><dl class="kv" style="margin-top:12px">${Object.entries(d.features||{}).map(([k,v])=>`<dt>${esc(k.replace(/_/g,' '))}</dt><dd class="mono">${esc(typeof v==='number'?+v.toFixed(2):v)}</dd>`).join('')}</dl></details></div></div>`}
$('sRun').onclick=run;
</script></body></html>
